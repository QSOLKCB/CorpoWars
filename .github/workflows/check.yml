name: Correctness
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.js
      - name: Measure exact renderer and navigation workloads
        run: |
          mkdir -p test-results
          node scripts/performance-render.mjs > test-results/renderer-performance.json
          node scripts/visual-polish-performance.mjs > test-results/visual-polish-performance.json
          node scripts/navigation-performance.mjs > test-results/navigation-performance.json
      - run: node scripts/build.mjs
      - name: Retain performance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: test-results/
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/corpowars-browser" --no-audit --no-fund playwright@1.56.1
          # Ubuntu 24.04 hosted runners already supply Chromium's shared libraries.
          # Avoid reinstalling system fonts/packages; the full browser test below
          # still fails if any required runtime library is absent.
          "$RUNNER_TEMP/corpowars-browser/node_modules/.bin/playwright" install chromium
      - run: node scripts/build.mjs
      - name: Compare native environment pixels with v0.3.0
        run: NODE_PATH="$RUNNER_TEMP/corpowars-browser/node_modules" node scripts/browser-renderer.cjs
      - name: Inspect polished actors and enforce native work budgets
        run: NODE_PATH="$RUNNER_TEMP/corpowars-browser/node_modules" node scripts/browser-polish.cjs
      - name: Retain character galleries before the gameplay checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-polish-galleries
          path: |
            test-results/polish-*.png
            test-results/visual-polish-browser.json
          if-no-files-found: ignore
      - name: Play the campaign and validate headquarters in Chromium WebGL2
        run: NODE_PATH="$RUNNER_TEMP/corpowars-browser/node_modules" node scripts/browser-check.cjs
      - name: Play the expansion and migrate an existing campaign in Chromium WebGL2
        run: NODE_PATH="$RUNNER_TEMP/corpowars-browser/node_modules" node scripts/browser-expansion.cjs
      - name: Retain visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            test-results/
            !test-results/polish-*.png
            !test-results/visual-polish-browser.json
          if-no-files-found: ignore
